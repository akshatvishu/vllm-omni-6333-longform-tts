name: Validate experiment and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU publication dependencies
        run: python -m pip install -r requirements-publication.txt
      - name: Verify frozen dataset
        run: PYTHONPATH=harness python scripts/validate_wikipedia.py
      - name: Verify all 100 lossless outputs
        run: python scripts/prepare_publication.py --verify
      - name: Rebuild latest comparison
        run: python scripts/build_latest_site.py
      - name: Verify publication links and evidence
        run: python scripts/validate_publication.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
